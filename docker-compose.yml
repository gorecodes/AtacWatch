# Tetto ai log dei container. Il driver json-file di default non ha alcun
# limite: il worker scrive una riga al minuto per sempre, e su una macchina con
# pochi GB liberi un log che nessuno ruota è una perdita silenziosa. 10 MB per
# 3 file fanno 30 MB per servizio, che restano abbondanti per capire cosa è
# andato storto stanotte.
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_DB: atacwatch
      POSTGRES_USER: atacwatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD richiesta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atacwatch -d atacwatch"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - internal
    # Porta NON esposta all'esterno: accessibile solo nella rete Docker interna.

  # Distanze a piedi reali per il calcolo percorsi. La linea d'aria non
  # sbagliava solo il numero mostrato: su SALARIA/CASTEL GIUBILEO dava 396
  # metri dove la strada reale è 4475, cioè sei minuti invece di 56, e il
  # router costruiva itinerari impossibili su quel dato.
  #
  # Qui gira solo osrm-routed, che mappa i dati da disco: misurato, 163 MB di
  # memoria. La preparazione (osrm-extract, che arriva a 722 MB di picco) si fa
  # con scripts/osrm-build.sh, una volta, e produce i file in ./osrm.
  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    logging: *log
    command: osrm-routed --algorithm mld --max-table-size 200 /data/roma.osrm
    volumes:
      - ./osrm:/data:ro
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    logging: *log
    environment:
      DATABASE_URL: postgres://atacwatch:${DB_PASSWORD}@db:5432/atacwatch
      OSRM_URL: http://osrm:5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # NOTA: fase 2 richiesta — supabase-js deve essere sostituito con postgres.js
    #       prima che l'app possa avviarsi correttamente.

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    logging: *log
    environment:
      DATABASE_URL: postgres://atacwatch:${DB_PASSWORD}@db:5432/atacwatch
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # NOTA: fase 3 richiesta — worker/index.ts deve essere creato.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *log
    ports:
      - "80:80"
      # La 443 serve per mettere Cloudflare su Full (strict): in quella
      # modalità l'edge parla con l'origine in TLS e ne verifica il
      # certificato. Con la sola 80 aperta, Cloudflare non riesce nemmeno a
      # connettersi e risponde 522.
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificati di origine e blocchi dei siti in TLS, SULL'HOST e non nel
      # repository. Due ragioni: il webhook fa git pull e reset, e una chiave
      # privata versionata è una chiave che prima o poi finisce in un commit;
      # e un blocco `tls` che punta a un certificato mancante impedisce a
      # Caddy di partire, quindi deve poter comparire solo quando il
      # certificato c'è davvero.
      - /etc/busroma/certs:/etc/caddy/certs:ro
      - /etc/busroma/siti:/etc/caddy/siti:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    networks:
      - internal

  # Servizio usa-e-getta per applicare le migrations.
  # Uso: docker compose run --rm migrate
  migrate:
    image: postgis/postgis:17-3.5
    environment:
      DATABASE_URL: postgres://atacwatch:${DB_PASSWORD}@db:5432/atacwatch
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    profiles: ["tools"]
    entrypoint: ["bash", "/migrate.sh"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
