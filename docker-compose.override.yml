# Override per test in locale: espone l'app su http://localhost:3000
# e disabilita Caddy (non serve TLS in LAN).
# Questo file viene caricato automaticamente da docker compose — non serve
# specificarlo. NON copiarlo sul VPS.
services:
  app:
    ports:
      - "3000:3000"

  caddy:
    profiles: ["production"]   # escluso dal profilo default → non parte
