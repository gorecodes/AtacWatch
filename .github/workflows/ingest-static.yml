name: Ingest GTFS statico

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile

      - name: Verifica secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERRORE: DATABASE_URL non ricevuto da GH Secrets"
            exit 1
          else
            echo "DATABASE_URL ricevuto (${#DATABASE_URL} caratteri)"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Esegui ETL
        run: pnpm ingest:static
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
