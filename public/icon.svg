<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bus Roma">
  <!--
    La PALINA di Roma: gialla, stretta e alta, su un palo visibile per tutta la
    lunghezza. La silhouette che la fa riconoscere è "cartello su un'asta": con
    una targhetta larga e il palo nascosto dietro, legge come una scheda gialla.

    A 48 pixel sopravvive solo una forma semplice: quattro elementi in tutto, e
    due sole barre — grosse, perché tre si impastano.

    Il gruppo è centrato ottiacamente sul riquadro: la targhetta sta a sinistra
    del palo, quindi il baricentro va compensato spostando tutto a destra.
  -->
  <rect width="512" height="512" rx="108" fill="#1B2027"/>

  <!-- Palo e base. -->
  <rect x="272" y="92" width="30" height="318" rx="15" fill="#9AA3A8"/>
  <rect x="226" y="398" width="122" height="26" rx="13" fill="#9AA3A8"/>

  <!-- La targhetta. -->
  <rect x="150" y="70" width="162" height="216" rx="16" fill="#F5B916"/>

  <!-- Due numeri di linea, grossi e distanziati. -->
  <rect x="180" y="112" width="102" height="34" rx="9" fill="#1B2027"/>
  <rect x="180" y="172" width="74" height="34" rx="9" fill="#1B2027" opacity="0.78"/>
</svg>
